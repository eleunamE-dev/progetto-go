name: book-reviews

on:
  push:
    branches: [main]
    paths:
      - "project-be-books/**"
      - ".github/workflows/book-reviews.yml"
  pull_request:
    paths:
      - "project-be-books/**"
      - ".github/workflows/book-reviews.yml"

permissions:
  contents: read

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project-be-books

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: project-be-books/go.mod
          cache-dependency-path: project-be-books/go.sum
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: project-be-books
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: project-be-books/go.mod
          cache-dependency-path: project-be-books/go.sum
      - name: Test with the race detector
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -n 1

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: project-be-books
          tags: bookreviews:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --detach --name api --publish 8080:8080 bookreviews:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/healthz
      - name: Container logs
        if: always()
        run: docker logs api || true
