name: book-reviews

on:
  push:
    branches: [main]
    paths:
      - "project-be-books/**"
      - ".github/workflows/book-reviews.yml"
  pull_request:
    paths:
      - "project-be-books/**"
      - ".github/workflows/book-reviews.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project-be-books

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: project-be-books
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy
      - name: Known vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements.txt
          uvx pip-audit --strict --disable-pip --requirement requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: project-be-books
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: project-be-books
          tags: bookreviews:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --detach --name api --publish 8080:8080 bookreviews:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8080/healthz
      - name: Container logs
        if: always()
        run: docker logs api || true
