name: book-reviews

on:
  push:
    branches: [main]
    paths:
      - "project-be-books/**"
      - ".github/workflows/book-reviews.yml"
  pull_request:
    paths:
      - "project-be-books/**"
      - ".github/workflows/book-reviews.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project-be-books

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: project-be-books
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy
      - name: Pre-commit hooks not run above
        env:
          SKIP: ruff-check,ruff-format,mypy,uv-lock
        run: uv run pre-commit run --config .pre-commit-config.yaml --all-files --show-diff-on-failure
      - name: Prometheus configuration and alert rules
        run: |
          promtool() { docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/etc/prometheus" -w /etc/prometheus prom/prometheus:v3.15.0 "$@"; }
          promtool check config prometheus.yml
          promtool test rules alerts.test.yml
      - name: Known vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements.txt
          uvx pip-audit --strict --disable-pip --requirement requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/bookreviews_test
      TEST_RABBITMQ_URL: amqp://user:password@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: project-be-books
          enable-cache: true
      - name: MariaDB and RabbitMQ, as defined in docker-compose.yaml
        run: docker compose up --detach --wait db rabbitmq
      - run: uv sync --locked
      - run: uv run pytest --cov

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: project-be-books
          tags: bookreviews:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --detach --name api --publish 8080:8080 bookreviews:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8080/healthz
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bookreviews:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Container logs
        if: always()
        run: docker logs api || true

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the overlays
        run: |
          for overlay in deploy/kubernetes/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | docker run --rm -i               ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e               -strict -summary -kubernetes-version 1.34.0               -schema-location default               -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'               -
            echo "::endgroup::"
          done

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, image, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/eleuname-dev/progetto-go/bookreviews
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: project-be-books
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
