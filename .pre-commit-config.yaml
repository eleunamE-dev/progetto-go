default_install_hook_types: [pre-commit, pre-push]
exclude: ^task-golang-concurrent-test/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check --directory project-be-books
        language: system
        files: ^project-be-books/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --directory project-be-books mypy
        language: system
        files: ^project-be-books/.*\.py$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --directory project-be-books pytest -q
        language: system
        files: ^project-be-books/
        pass_filenames: false
        stages: [pre-push]
