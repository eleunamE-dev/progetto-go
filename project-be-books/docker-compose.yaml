services:

  db:
    image: mariadb:11.3.2
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookreviews
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13.0-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build: .
    environment:
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    # Longer than HTTP_SHUTDOWN_TIMEOUT (15s), so in-flight requests can
    # finish before Docker resorts to SIGKILL.
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  db-data:
