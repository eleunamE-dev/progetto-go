x-environment: &environment
  LOG_LEVEL: INFO
  DATABASE_URL: mysql+aiomysql://app:app-password@db:3306/bookreviews
  RABBITMQ_URL: amqp://user:password@rabbitmq:5672/

x-app: &app
  build: .
  image: bookreviews
  environment: *environment

services:

  db:
    image: mariadb:12.3.2
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookreviews
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./deploy/mariadb/users.sql:/docker-entrypoint-initdb.d/users.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  migrate:
    <<: *app
    command: ["bookreviews-migrate"]
    environment:
      <<: *environment
      DATABASE_URL: mysql+aiomysql://migrator:migrator-password@db:3306/bookreviews
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *environment
      API_KEYS: '{"local-dev": "ed5a18fb8f807f996d649e379d3f35f39c543a91bdbf88c492f2ebd10d4df86c"}'
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9100:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["bookreviews-worker"]
    ports:
      - "127.0.0.1:9101:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  db-data:
