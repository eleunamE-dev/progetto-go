default_install_hook_types: [pre-commit, pre-push]
files: ^project-be-books/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^project-be-books/uv\.lock$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check --directory project-be-books
        language: system
        files: ^project-be-books/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --directory project-be-books mypy
        language: system
        files: ^project-be-books/.*\.py$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --directory project-be-books pytest -q
        language: system
        files: ^project-be-books/
        pass_filenames: false
        stages: [pre-push]
