[project]
name = "bookreviews"
version = "0.1.0"
description = "Book review service backed by the Gutendex catalog"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1",
    "aiomysql>=0.3",
    "alembic>=1.20",
    "fastapi>=0.142",
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-aio-pika>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45",
    "prometheus-client>=0.26",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
bookreviews-api = "bookreviews.main:run_api"
bookreviews-migrate = "bookreviews.main:run_migrations"
bookreviews-worker = "bookreviews.main:run_worker"
bookreviews-openapi = "bookreviews.openapi:main"
bookreviews-api-key = "bookreviews.auth:main"
bookreviews-admin = "bookreviews.admin:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "ERA",
    "S", "ASYNC", "DTZ", "LOG", "G", "T20", "PT", "TRY", "PERF", "PL", "FAST", "RUF",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLR0913", "PLR0917", "ARG001", "ARG002"]
"e2e/**" = ["T201", "S603", "S607", "S608", "PLR2004"]
"src/bookreviews/reviews.py" = ["PLR0913"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["prometheus_client"]
files = ["src", "tests", "e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
markers = ["integration: needs a MariaDB database, set TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["bookreviews"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
