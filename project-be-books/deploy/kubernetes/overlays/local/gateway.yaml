apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bookreviews
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: bookreviews.localtest.me
    - name: https
      protocol: HTTPS
      port: 443
      hostname: bookreviews.localtest.me
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bookreviews-tls
