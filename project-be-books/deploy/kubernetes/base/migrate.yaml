apiVersion: batch/v1
kind: Job
metadata:
  name: bookreviews-migrate
  labels:
    app.kubernetes.io/name: bookreviews
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookreviews
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: bookreviews
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: bookreviews
          command: ["bookreviews-migrate"]
          envFrom:
            - configMapRef:
                name: bookreviews-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bookreviews-migrator
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
