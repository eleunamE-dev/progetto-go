rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="bookreviews-api", instance="api:9100"}'
        values: "1 1 0 0 0 0"
      - series: 'up{job="bookreviews-worker", instance="worker:9100"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: BookReviewsApiDown
        exp_alerts: []
      - eval_time: 5m
        alertname: BookReviewsApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The book reviews API does not answer
              description: No instance of the API has answered Prometheus for 2 minutes, or none is running.
              runbook_url: https://github.com/eleunamE-dev/progetto-go/blob/main/project-be-books/docs/runbook.md#bookreviewsapidown
      - eval_time: 5m
        alertname: BookReviewsWorkerDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="bookreviews-worker", instance="10.244.1.5:9100", pod="bookreviews-worker-a"}'
        values: "1 1 0 0 0 0"
      - series: 'up{job="bookreviews-worker", instance="10.244.2.7:9100", pod="bookreviews-worker-b"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: BookReviewsWorkerDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="bookreviews-api", instance="api:9100"}'
        values: "1x5"
      - series: 'up{job="bookreviews-worker", instance="10.244.1.5:9100", pod="bookreviews-worker-a"}'
        values: "1 1 stale"
    alert_rule_test:
      - eval_time: 2m
        alertname: BookReviewsWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: BookReviewsWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The enrichment worker does not answer
              description: No worker has answered Prometheus for 2 minutes, or none is running; new reviews stay pending.
              runbook_url: https://github.com/eleunamE-dev/progetto-go/blob/main/project-be-books/docs/runbook.md#bookreviewsworkerdown

  - interval: 1m
    input_series:
      - series: 'bookreviews_http_requests_total{method="GET", route="/review/{review_id}", status="200"}'
        values: "0+90x20"
      - series: 'bookreviews_http_requests_total{method="POST", route="/review", status="503"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: BookReviewsHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: More than 5% of the API requests fail
              description: "10% of the requests answered 5xx over the last 10 minutes: check the database and Gutendex."
              runbook_url: https://github.com/eleunamE-dev/progetto-go/blob/main/project-be-books/docs/runbook.md#bookreviewshigherrorrate

  - interval: 1m
    input_series:
      - series: 'bookreviews_http_requests_total{method="GET", route="/review/{review_id}", status="200"}'
        values: "0+99x20"
      - series: 'bookreviews_http_requests_total{method="POST", route="/review", status="503"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: BookReviewsHighErrorRate
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'bookreviews_catalog_rejections_total{job="bookreviews-api", instance="api:9100", reason="circuit_open"}'
        values: "0+4x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: BookReviewsCatalogSuspended
        exp_alerts: []
      - eval_time: 7m
        alertname: BookReviewsCatalogSuspended
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Calls to Gutendex are suspended
              description: For 5 minutes the circuit breaker has refused calls to Gutendex after repeated failures. Searches and reviews of books not in the cache answer 503, and enrichments wait.
              runbook_url: https://github.com/eleunamE-dev/progetto-go/blob/main/project-be-books/docs/runbook.md#bookreviewscatalogsuspended

  - interval: 1m
    input_series:
      - series: 'bookreviews_catalog_circuit_open{job="bookreviews-api", instance="api:9100"}'
        values: "0 1x30"
      - series: 'bookreviews_catalog_rejections_total{job="bookreviews-api", instance="api:9100", reason="circuit_open"}'
        values: "0 3x30"
    alert_rule_test:
      - eval_time: 7m
        alertname: BookReviewsCatalogSuspended
        exp_alerts: []
      - eval_time: 30m
        alertname: BookReviewsCatalogSuspended
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'bookreviews_oldest_pending_review_age_seconds{job="bookreviews-worker", instance="worker:9100"}'
        values: "3600x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: BookReviewsEnrichmentBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Reviews are not being enriched
              description: The oldest pending review is 1h 0m 0s old. Check the worker, RabbitMQ and Gutendex.
              runbook_url: https://github.com/eleunamE-dev/progetto-go/blob/main/project-be-books/docs/runbook.md#bookreviewsenrichmentbacklog

  - interval: 1m
    input_series:
      - series: 'bookreviews_enrichments_total{outcome="parked", job="bookreviews-worker", instance="worker:9100"}'
        values: "0 0 0 1 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: BookReviewsParkedMessages
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Malformed messages were parked
              description: The worker moved malformed messages to review.enrichment.parked in the last hour. Inspect them in the RabbitMQ management UI.
              runbook_url: https://github.com/eleunamE-dev/progetto-go/blob/main/project-be-books/docs/runbook.md#bookreviewsparkedmessages
