groups:
  - name: bookreviews
    rules:
      - alert: BookReviewsApiDown
        expr: up{job="bookreviews-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The book reviews API does not answer
          description: Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes.

      - alert: BookReviewsWorkerDown
        expr: up{job="bookreviews-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The enrichment worker does not answer
          description: Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes; new reviews stay pending.

      - alert: BookReviewsHighErrorRate
        expr: |
          sum(rate(bookreviews_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(bookreviews_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of the API requests fail
          description: "{{ $value | humanizePercentage }} of the requests answered 5xx over the last 10 minutes: check the database and Gutendex."

      - alert: BookReviewsSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(bookreviews_http_request_duration_seconds_bucket{route=~"/review.*"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Review requests are slow
          description: The 95th percentile of {{ $labels.route }} has been above 2 s for 10 minutes.

      - alert: BookReviewsCatalogSuspended
        expr: max(bookreviews_catalog_circuit_open) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Calls to Gutendex are suspended
          description: The circuit breaker has been open for 5 minutes. Searches and reviews of books not in the cache answer 503.

      - alert: BookReviewsEnrichmentBacklog
        expr: max(bookreviews_oldest_pending_review_age_seconds) > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Reviews are not being enriched
          description: The oldest pending review is {{ $value | humanizeDuration }} old. Check the worker, RabbitMQ and Gutendex.

      - alert: BookReviewsParkedMessages
        expr: sum(increase(bookreviews_enrichments_total{outcome="parked"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Malformed messages were parked
          description: The worker moved malformed messages to review.enrichment.parked in the last hour. Inspect them in the RabbitMQ management UI.

      - alert: BookReviewsQueuePublishFailures
        expr: sum(rate(bookreviews_queue_publish_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The API cannot publish to RabbitMQ
          description: Reviews are saved but not queued; the sweeper queues them once RabbitMQ is back.
